<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Technocore Identity</title>
  <desc id="logoDesc">A circular wax-seal mark with a key motif at its center, representing a signed cryptographic identity.</desc>

  <!-- Outer seal body -->
  <circle cx="100" cy="100" r="92" fill="#B8433A"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#8F332C" stroke-width="2"/>

  <!-- Wax drip texture: irregular inner rim to suggest pressed wax, not a perfect vector circle -->
  <path d="M 100 8
           C 132 8, 160 22, 178 46
           C 194 68, 196 80, 190 90
           C 196 98, 196 108, 188 118
           C 194 130, 188 146, 176 160
           C 160 180, 136 194, 108 196
           C 100 197, 94 196, 88 194
           C 62 192, 40 178, 24 156
           C 10 138, 6 116, 10 94
           C 6 76, 14 56, 28 38
           C 48 14, 74 8, 100 8 Z"
        fill="none" stroke="#8F332C" stroke-width="3" opacity="0.4"/>
  <path d="M 100 8
           C 132 8, 160 22, 178 46
           C 194 68, 196 80, 190 90
           C 196 98, 196 108, 188 118
           C 194 130, 188 146, 176 160
           C 160 180, 136 194, 108 196
           C 100 197, 94 196, 88 194
           C 62 192, 40 178, 24 156
           C 10 138, 6 116, 10 94
           C 6 76, 14 56, 28 38
           C 48 14, 74 8, 100 8 Z"
        fill="none" stroke="#D65B4F" stroke-width="1.5" opacity="0.5" transform="translate(-1.5,-1.5)"/>

  <!-- Inner recessed ring, as if stamped -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#8F332C" stroke-width="1.5" opacity="0.6"/>

  <!-- Key motif at center: a simple did:key-referencing bow-and-shaft key -->
  <g transform="translate(100 100)">
    <circle cx="-16" cy="0" r="18" fill="none" stroke="#FAF9F6" stroke-width="7"/>
    <rect x="-2" y="-3.5" width="44" height="7" rx="1" fill="#FAF9F6"/>
    <rect x="26" y="3.5" width="7" height="14" fill="#FAF9F6"/>
    <rect x="37" y="3.5" width="7" height="10" fill="#FAF9F6"/>
  </g>
</svg>
