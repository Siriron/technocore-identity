<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Technocore Identity</title>
  <desc id="logoDesc">Squircle app icon: an indigo-to-coral gradient monogram mark reading TC, with a small glowing identity node at the lower right.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E7EEF"/>
      <stop offset="55%" stop-color="#8B6FE0"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#17D9A8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#17D9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="innerSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle base (iOS-style superellipse approximation) -->
  <path d="M128 8
           C 224 8, 248 32, 248 128
           C 248 224, 224 248, 128 248
           C 32 248, 8 224, 8 128
           C 8 32, 32 8, 128 8 Z"
        fill="url(#bgGrad)"/>
  <path d="M128 8
           C 224 8, 248 32, 248 128
           C 248 224, 224 248, 128 248
           C 32 248, 8 224, 8 128
           C 8 32, 32 8, 128 8 Z"
        fill="url(#innerSheen)"/>

  <!-- TC monogram -->
  <g fill="#FFFFFF" font-family="'Sora', 'Segoe UI', system-ui, sans-serif" font-weight="800">
    <text x="128" y="158" font-size="118" text-anchor="middle" letter-spacing="-2">TC</text>
  </g>

  <!-- Identity node accent, lower-right — echoes the app's live/verified signal color -->
  <circle cx="196" cy="196" r="30" fill="url(#nodeGlow)"/>
  <circle cx="196" cy="196" r="11" fill="#0B0E14" opacity="0.25"/>
  <circle cx="196" cy="196" r="9" fill="#17D9A8"/>
  <circle cx="196" cy="196" r="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
